name: Build and Test

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'PillAppBackend/**'
      - 'Directory.Packages.props'
      - 'PillApp.slnx'
      - 'Dockerfile'
      - '.github/workflows/build-test.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'PillAppBackend/**'
      - 'Directory.Packages.props'
      - 'PillApp.slnx'
      - 'Dockerfile'

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'

      - name: Restore dependencies
        run: dotnet restore PillApp.slnx

      - name: Check for vulnerable packages
        run: dotnet list PillApp.slnx package --vulnerable --include-transitive

      - name: Build
        run: dotnet build PillApp.slnx -c Release --no-restore

      - name: Test
        run: dotnet test PillApp.slnx -c Release --no-build --verbosity normal

      - name: Build Docker Image
        run: docker build -f Dockerfile -t pillapp-backend:latest .
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
