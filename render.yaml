services:
  - type: web
    name: pillapp-api
    env: docker
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ConnectionStrings__SupabaseDb
        sync: false
      - key: Security__KeepaliveSecret
        sync: false
      - key: Cors__AllowedOrigins__0
        sync: false
