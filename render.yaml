services:
  - type: web
    name: pillapp-api
    env: docker
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ConnectionStrings__SupabaseDb
        sync: false
      - key: Security__JwtIssuer
        sync: false
      - key: Security__JwtAudience
        sync: false
      - key: Security__JwtSigningKey
        sync: false
      - key: Security__AdminUsername
        sync: false
      - key: Security__AdminPassword
        sync: false
      - key: Security__AdminRole
        value: admin
      - key: Security__KeepaliveSecret
        sync: false